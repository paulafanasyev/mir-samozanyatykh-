# Мир Самозанятых — Render Blueprint v8.6.5
services:
  - type: web
    name: mir-samozanyatykh-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "./startup.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mir-samozanyatykh-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mir-samozanyatykh-redis
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1

  - type: redis
    name: mir-samozanyatykh-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: mir-samozanyatykh-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
    databaseName: mir_samozanyatykh
    user: mir_samozanyatykh_user
