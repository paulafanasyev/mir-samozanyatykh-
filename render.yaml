services:
  - type: web
    name: mir-samozanyatykh-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mir-samozanyatykh-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mir-samozanyatykh-redis
          property: connectionString
    healthCheckPath: /api/health
    autoDeploy: true

  - type: redis
    name: mir-samozanyatykh-redis
    plan: free
    ipAllowList: []

databases:
  - name: mir-samozanyatykh-db
    plan: free
    postgresMajorVersion: 16
