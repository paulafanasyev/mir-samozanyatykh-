services:
  # PostgreSQL Database
  - type: psql
    name: mirsamozanyatykh-db
    plan: starter
    ipAllowList: []

  # Redis Cache
  - type: redis
    name: mirsamozanyatykh-redis
    plan: starter
    ipAllowList: []

  # Backend API (FastAPI)
  - type: web
    name: mirsamozanyatykh-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mirsamozanyatykh-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mirsamozanyatykh-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DOMAIN
        value: mirsamozanyatykh-api.onrender.com
      - key: FRONTEND_URL
        value: https://mirsamozanyatykh.onrender.com
      - key: RATE_LIMIT_REQUESTS
        value: "100"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: "MIR Samozanyatykh"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL_DEFAULT
        value: "anthropic/claude-3.5-sonnet"
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: YOOKASSA_RETURN_URL
        value: "https://mirsamozanyatykh.onrender.com/payment/success"
      - key: YOOKASSA_CANCEL_URL
        value: "https://mirsamozanyatykh.onrender.com/payment/cancel"
      - key: FNS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SMS_RU_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: /app/logs/app.log
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: UPLOAD_DIR
        value: /app/uploads
    healthCheckPath: /api/health
    autoDeploy: true

  # Frontend (Vite + React SPA)
  - type: web
    name: mirsamozanyatykh
    runtime: static
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://mirsamozanyatykh-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
