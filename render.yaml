services:
  - type: web
    name: mirsamozanyatykh-api
    runtime: docker
    rootDir: src
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mir-samozanyatykh-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mir-samozanyatykh-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://mirsamozanyatykh-frontend.onrender.com
      - key: DOMAIN
        value: mir-samozanyatykh-api-frankfurt.onrender.com
      - key: SECRET_KEY
        sync: false
      - key: BANK_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.yandex.ru
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL_DEFAULT
        value: anthropic/claude-3.5-sonnet
      - key: OPENROUTER_MODEL_CHEAP
        value: openai/gpt-4o-mini
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: YOOKASSA_RETURN_URL
        value: https://mirsamozanyatykh-frontend.onrender.com/payment/success
      - key: YOOKASSA_CANCEL_URL
        value: https://mirsamozanyatykh-frontend.onrender.com/payment/cancel
      - key: FNS_API_KEY
        sync: false
      - key: SMS_RU_API_KEY
        sync: false
      - key: SMS_RU_SENDER
        value: MirSamoz
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://mir-samozanyatykh-api-frankfurt.onrender.com/api/telegram/webhook
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YANDEX_CLIENT_ID
        sync: false
      - key: YANDEX_CLIENT_SECRET
        sync: false
      - key: WEBRTC_STUN_SERVER
        value: stun:stun.l.google.com:19302
      - key: COSYVOICE_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: /app/logs/app.log
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: UPLOAD_DIR
        value: /app/uploads

  - type: web
    name: mirsamozanyatykh
    runtime: static
    rootDir: src/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://mir-samozanyatykh-api-frankfurt.onrender.com
      - key: VITE_API_BASE_URL
        value: https://mir-samozanyatykh-api-frankfurt.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: mir-samozanyatykh-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: mir-samozanyatykh-db
    plan: basic-256mb
    databaseName: mir_samozanyatykh
    user: mir_app
