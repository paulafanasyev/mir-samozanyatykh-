{% extends "base.html" %}
{% block title %}Светлана — ИИ-ассистент{% endblock %}
{% block content %}
<div class="chat-container svetlana-page-v839">
    <div class="svetlana-hero-head">
      <div class="svetlana-photo"><img src="/static/svetlana/face.png" alt="Светлана"></div>
      <div><div class="eyebrow">МИР САМОЗАНЯТЫХ</div><h2>Светлана — ваш ИИ-ассистент</h2><p>Помогает с налогами, документами, клиентами и рабочими задачами.</p></div>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input">
        <select id="category-select"><option value="">Все категории</option></select>
        <input type="text" id="question-input" placeholder="Задайте вопрос..." maxlength="500">
        <button onclick="askSvetlana()" class="btn-primary">Спросить</button>
    </div>
</div>
<style nonce="{{ csp_nonce }}">
.svetlana-page-v839{max-width:960px;margin:40px auto;padding:28px;border:1px solid #ece7df;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(23,26,34,.08)}
.svetlana-hero-head{display:flex;gap:18px;align-items:center;padding:18px;border-radius:22px;background:linear-gradient(135deg,#fff7ed,#fffbeb);border:1px solid #fed7aa;margin-bottom:20px}
.svetlana-photo{width:78px;height:78px;overflow:hidden;border-radius:22px;background:#171a22;flex:none}.svetlana-photo img{width:100%;height:100%;object-fit:cover;object-position:top}.svetlana-hero-head h2{margin:4px 0 4px}.svetlana-hero-head p{margin:0;color:#64748b}
@media(max-width:640px){.svetlana-hero-head{align-items:flex-start}.svetlana-photo{width:64px;height:64px}}
</style>

<script nonce="{{ csp_nonce }}">
async function loadCategories() {
    try {
        const res = await fetch('/api/svetlana/categories');
        const data = await res.json();
        const select = document.getElementById('category-select');
        data.categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.key;
            opt.textContent = cat.title;
            select.appendChild(opt);
        });
    } catch (e) {}
}

function addMessage(text, isUser = false) {
    const div = document.createElement('div');
    div.className = isUser ? 'message user' : 'message bot';
    div.textContent = text;
    document.getElementById('chat-messages').appendChild(div);
    div.scrollIntoView();
}

async function askSvetlana() {
    const input = document.getElementById('question-input');
    const category = document.getElementById('category-select').value;
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, true);
    input.value = '';

    try {
        const form = new FormData();
        form.append('question', question);
        if (category) form.append('category', category);
        const res = await fetch('/api/svetlana/ask', { method: 'POST', body: form });
        const data = await res.json();
        addMessage(data.answer);
    } catch (err) {
        addMessage('Извините, произошла ошибка. Попробуйте позже.');
    }
}

document.getElementById('question-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') askSvetlana();
});

loadCategories();
addMessage('Привет! Я Светлана, ваш ИИ-ассистент. Чем могу помочь?');
</script>
{% endblock %}
