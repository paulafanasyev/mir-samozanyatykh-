version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mir-samozanyatykh-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mir_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mir_samozanyatykh}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - BANK_ENCRYPTION_KEY=${BANK_ENCRYPTION_KEY:?BANK_ENCRYPTION_KEY must be set}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - FNS_API_KEY=${FNS_API_KEY}
      - ENVIRONMENT=production
      - DEBUG=false
      - DOMAIN=${DOMAIN:?DOMAIN must be set}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be set}
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  db:
    image: postgres:16-alpine
    container_name: mir-samozanyatykh-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mir_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-mir_samozanyatykh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mir_app} -d ${POSTGRES_DB:-mir_samozanyatykh}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: mir-samozanyatykh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backup:
    image: postgres:16-alpine
    container_name: mir-samozanyatykh-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGUSER: ${POSTGRES_USER:-mir_app}
      PGDATABASE: ${POSTGRES_DB:-mir_samozanyatykh}
      PGHOST: db
    command:
      - /bin/sh
      - -c
      - >-
        while true; do
          mkdir -p /backups;
          ts=$$(date -u +%Y%m%dT%H%M%SZ);
          tmp="/backups/.db_$${ts}.dump.tmp";
          out="/backups/db_$${ts}.dump";
          if pg_dump -Fc -U "$$PGUSER" -d "$$PGDATABASE" -h "$$PGHOST" > "$$tmp"; then
            chmod 600 "$$tmp";
            mv "$$tmp" "$$out";
            sha256sum "$$out" > "$$out.sha256";
            chmod 600 "$$out.sha256";
          else
            rm -f "$$tmp";
          fi;
          find /backups -type f -name 'db_*.dump' -mtime +14 -delete;
          find /backups -type f -name 'db_*.dump.sha256' -mtime +14 -delete;
          sleep 86400;
        done
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mir-samozanyatykh-frontend
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: mir-samozanyatykh-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./static:/app/static:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: mir-samozanyatykh-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:12.1.1
    container_name: mir-samozanyatykh-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - app-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  static_files:
  prometheus_data:
  grafana_data:
  backups:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
