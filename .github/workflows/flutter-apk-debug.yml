# Debug APK сборка «Мир Самозанятых» на GitHub Actions
# Положите в репозиторий: .github/workflows/flutter-apk-debug.yml
# Запуск: push в main/master или Actions → "Build debug APK" → Run workflow
# Результат: артефакт mir_app-debug-apk (mobile/build/app/outputs/flutter-apk/app-debug.apk)
# Причина: локальная машина 3.9 ГБ RAM не тянет сборку (root = tmpfs = RAM).
# ubuntu-latest = 7 ГБ RAM, 14 ГБ диска — достаточно.

name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Rewrite pubspec.yaml (в репо он на одной строке — сломан)
        working-directory: mobile
        run: |
          # В репо pubspec.yaml хранится в одну строку (битый YAML из-за потери \n).
          # Заменяем его целиком на корректный, с уже проставленными версиями
          # flutter_form_builder 9.5.0 и form_builder_validators 10.0.0
          # (фикс конфликта с intl ^0.19.0).
          cat > pubspec.yaml <<'PUBSPEC_EOF'
          name: mir_samozanyatykh_mobile
          description: Мир Самозанятых — мобильное приложение
          publish_to: 'none'
          version: 8.5.0+850
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            # Navigation
            go_router: ^14.0.0
            # State management
            flutter_riverpod: ^2.5.0
            # HTTP client
            dio: ^5.4.0
            retrofit: ^4.1.0
            # JSON serialization
            json_annotation: ^4.9.0
            freezed_annotation: ^2.4.0
            # Local storage
            hive: ^2.2.3
            hive_flutter: ^1.1.0
            # Firebase
            firebase_core: ^2.27.0
            firebase_messaging: ^14.7.0
            firebase_auth: ^4.17.0
            cloud_firestore: ^4.15.0
            # UI
            google_fonts: ^6.2.0
            flutter_svg: ^2.0.9
            shimmer: ^3.0.0
            flutter_slidable: ^3.0.1
            # Forms (форкс: совместимые с intl 0.19)
            flutter_form_builder: 9.5.0
            form_builder_validators: 10.0.0
            # Date/Time
            intl: ^0.19.0
            # Charts
            fl_chart: ^0.68.0
            # Payments
            webview_flutter: ^4.7.0
            url_launcher: ^6.2.0
            # Utils
            equatable: ^2.0.5
            dartz: ^0.10.1
            logger: ^2.0.2
            # WebRTC (calls)
            flutter_webrtc: ^0.9.47
            # Image
            image_picker: ^1.0.7
            cached_network_image: ^3.3.1
            # Notifications
            flutter_local_notifications: ^17.0.0
            # Biometrics
            local_auth: ^2.2.0
            # QR codes
            qr_flutter: ^4.1.0
            mobile_scanner: ^3.5.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
            build_runner: ^2.4.0
            freezed: ^2.4.0
            json_serializable: ^6.7.0
            retrofit_generator: ^8.1.0
            hive_generator: ^2.0.1
          flutter:
            uses-material-design: true
            assets:
              - assets/images/
              - assets/icons/
          PUBSPEC_EOF
          echo "---WRITTEN---"
          head -10 pubspec.yaml

      - name: Generate android scaffold
        working-directory: mobile
        run: |
          # android/ отсутствует в репо — генерируем (теперь pubspec уже корректный)
          flutter create --org com.mirsamozanyatykh --project-name mir_samozanyatykh_mobile --platforms=android .

      - name: Create assets directories
        working-directory: mobile
        run: |
          # assets/ декларированы в pubspec, но отсутствуют в репо
          mkdir -p assets/images assets/icons
          touch assets/images/.gitkeep assets/icons/.gitkeep

      - name: Flutter pub get
        working-directory: mobile
        # google-services.json НЕ нужен: google-services плагина в build.gradle нет
        run: flutter pub get

      - name: Build debug APK (arm64)
        working-directory: mobile
        # arm64-only: fat-APK (4 ABI, webrtc/MLKit) > 80 МБ. Для всех ABI уберите --target-platform.
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mir_app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Verify APK
        working-directory: mobile
        run: |
          file build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk | tail -3
          stat -c 'SIZE: %s' build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk

# Примечания:
# - Debug-сборка: подпись debug-ключом, Firebase в рантайме работать не будет
#   (нет google-services.json / Firebase-проекта владельца).
# - Для release-сборки нужен keystore владельца (секреты: KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#   KEY_ALIAS, KEY_PASSWORD) + android/key.properties + настройка signingConfig.
