name: Agent Regression Push Tests

on:
  push:
    branches: [feat/agent-orchestrator-v1]
    paths:
      - 'app/agents/**'
      - 'app/agent_api.py'
      - 'app/core/config.py'
      - 'app/main.py'
      - 'tests/**'
      - '.github/workflows/agents-tests-push.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run agent and repository tests
        run: python -m unittest discover -s tests -q
