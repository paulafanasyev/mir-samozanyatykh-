name: AI Security Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

concurrency:
  group: ai-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies required by security contracts
        run: |
          python -m pip install --disable-pip-version-check --no-input -r src/requirements.txt
      - name: Compile security modules
        run: |
          python -m py_compile src/app/services/agent_guard.py
          python -m py_compile src/app/services/agent_tools.py
          python -m py_compile src/app/services/ai_router.py
          python -m py_compile src/app/api/agent_guard.py
          python -m py_compile src/app/api/svetlana.py
      - name: Run guard regression
        run: python tests/security/test_agent_guard_standalone.py
      - name: Run tool-policy regression
        run: python tests/security/test_tool_policy_extra.py
      - name: Run tool-policy contract
        run: python tests/security/test_tool_policy_contract.py
      - name: Run role-policy contract
        run: python tests/security/test_role_policy_contract.py
      - name: Run admin-allowlist contract
        run: python tests/security/test_admin_allowlist_contract.py
