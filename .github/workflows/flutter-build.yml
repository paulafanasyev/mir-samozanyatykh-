name: Flutter Build & Test

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - profile

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --${{ github.event.inputs.build_type || 'debug' }}             --target-platform android-arm64             --build-name=8.6.3             --build-number=863
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.event.inputs.build_type || 'debug' }}-v8.6.3
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      - name: Create Release
        if: github.ref == 'refs/heads/main' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-*.apk
          tag_name: v8.6.3-mobile
          name: "Мир Самозанятых v8.6.3 (Mobile)"
          body: |
            ## Мобильное приложение Мир Самозанятых v8.6.3

            ### Возможности:
            - 25+ экранов с Material 3 дизайном
            - ИИ-ассистент Светлана
            - Биометрическая аутентификация
            - CRM, бухгалтерия, аналитика
            - Админ-панель (RBAC)

            ### Требования:
            - Android 6.0+ (API 23+)
            - 100 MB свободного места
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
