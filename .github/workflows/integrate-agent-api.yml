name: Integrate Agent API

on:
  push:
    branches: [feat/agent-orchestrator-v1]
    paths:
      - 'app/agent_api.py'
      - '.github/workflows/integrate-agent-api.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'integrate agent router') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-orchestrator-v1

      - name: Integrate router once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/main.py')
          text = path.read_text(encoding='utf-8')
          marker = 'from app.agent_api import router as agent_router\n'
          if marker not in text:
              text += '\n\n# Multi-agent engineering API (wired after all main dependencies are defined).\n' + marker + 'app.include_router(agent_router)\n'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(agents): integrate agent router'
          git push origin HEAD:feat/agent-orchestrator-v1
