name: Agent Orchestrator Tests

on:
  push:
    paths:
      - 'app/agents/**'
      - 'app/agent_api.py'
      - 'app/core/config.py'
      - 'app/main.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/agents-tests.yml'
  pull_request:
    paths:
      - 'app/agents/**'
      - 'app/agent_api.py'
      - 'app/core/config.py'
      - 'app/main.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/agents-tests.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run full agent regression suite
        run: python -m unittest discover -s tests -q
