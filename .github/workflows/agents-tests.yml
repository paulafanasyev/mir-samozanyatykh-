name: Agent Orchestrator Tests

on:
  push:
    paths:
      - 'app/agents/**'
      - 'tests/test_agent_orchestrator.py'
      - '.github/workflows/agents-tests.yml'
  pull_request:
    paths:
      - 'app/agents/**'
      - 'tests/test_agent_orchestrator.py'
      - '.github/workflows/agents-tests.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run agent tests
        run: python -m unittest tests/test_agent_orchestrator.py -v
