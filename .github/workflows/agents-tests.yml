name: Agent Orchestrator Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run full regression suite
        env:
          SECRET_KEY: ci-test-secret
          JWT_SECRET_KEY: ci-test-jwt-secret
          AGENT_PROVIDER_ORDER: openrouter,openai,ollama
          AGENT_RUNTIME_BASE_URL: http://127.0.0.1:9
          AGENT_RUNTIME_TIMEOUT: '2'
        run: python -m unittest discover -s tests -q
