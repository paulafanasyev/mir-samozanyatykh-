name: Svetlana Runtime Verification

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify-svetlana:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run Svetlana Verifier
      run: |
        python scripts/verify_svetlana.py
    
    - name: Check JavaScript syntax
      run: |
        for file in static/js/*.js; do
          echo "Checking $file..."
          node --check "$file" || exit 1
        done
    
    - name: Verify avatar images
      run: |
        python -c "
from PIL import Image
import os
for img in ['svetlana-current.webp', 'svetlana-light.webp', 'svetlana-dark.webp']:
    path = f'static/images/svetlana/{img}'
    assert os.path.exists(path), f'{img} not found'
    img_obj = Image.open(path)
    assert img_obj.format == 'WEBP', f'{img} is not WEBP'
    print(f'✓ {img}: {img_obj.size[0]}x{img_obj.size[1]}px')
"
