name: Frontend check

on:
  pull_request:
    paths:
      - 'src/frontend/**'
      - 'render.yaml'
      - '.github/workflows/frontend-check.yml'
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'render.yaml'
      - '.github/workflows/frontend-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
