{% extends "base.html" %}
{% block title %}Регистрация — Мир Самозанятых{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Регистрация</h2>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form id="register-form">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="full_name" required placeholder="Иван Иванов">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required minlength="8" placeholder="Минимум 8 символов">
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" id="phone" placeholder="+7XXXXXXXXXX">
            </div>
            <div class="form-group">
                <label>ИНН (12 цифр)</label>
                <input type="text" id="inn" pattern="\d{12}" placeholder="123456789012">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
        </form>
        <p class="auth-link">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            full_name: document.getElementById('full_name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            phone: document.getElementById('phone').value,
            inn: document.getElementById('inn').value
        })
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = '/dashboard';
    } else {
        alert(data.detail || 'Ошибка регистрации');
    }
});
</script>
{% endblock %}
