{% extends "base.html" %}
{% block title %}Гранты — МИР Самозанятых{% endblock %}
{% block content %}
<div class="dashboard">
    <div class="dashboard-header">
        <h1>🎁 Гранты и поддержка</h1>
        <button class="btn btn-primary" onclick="document.getElementById('grantModal').style.display='flex'">+ Подать заявку</button>
    </div>
    <div id="grantsList">
        <div class="skeleton" style="height:200px"></div>
    </div>
</div>

<div id="grantModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:2000;align-items:center;justify-content:center;padding:16px">
    <div class="auth-card" style="max-width:500px;width:100%">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <h2>Новая заявка на грант</h2>
            <button class="btn btn-ghost" onclick="document.getElementById('grantModal').style.display='none'">✕</button>
        </div>
        <form id="grantForm">
            <div class="form-group">
                <label class="form-label">Название проекта</label>
                <input type="text" id="grantTitle" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Описание</label>
                <input type="text" id="grantDesc" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Запрашиваемая сумма (₽)</label>
                <input type="number" id="grantAmount" class="form-input" required min="0">
            </div>
            <div class="form-group">
                <label class="form-label">Дедлайн</label>
                <input type="date" id="grantDeadline" class="form-input">
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Подать заявку</button>
        </form>
    </div>
</div>
{% endblock %}
